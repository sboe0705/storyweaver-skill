name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Check and package skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check shell scripts
        run: |
          bash -n build.sh install.sh release.sh
          shellcheck build.sh install.sh release.sh
      - name: Check and build zip
        run: ./build.sh
      # archive: false uploads the zip as-is instead of wrapping it in a
      # second zip; the artifact is then named after the file
      # (storyweaver.zip) and can be uploaded to an agent directly.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/storyweaver.zip
          archive: false
          if-no-files-found: error
